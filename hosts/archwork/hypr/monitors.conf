# See https://wiki.hyprland.org/Configuring/Monitors/
env = GDK_SCALE,1.75
# HDR disabled 2026-08-13: the panel advertises no PQ/HLG EOTF in its EDID (only
# "Traditional gamma - SDR luminance range") at ~486 nits, so cm,hdr bought BT.2020
# signalling and nothing else, while costing washed-out screenshots and untuned
# SDR tone-mapping. bitdepth,10 is kept for gradient banding. To re-enable:
# append ,cm,hdr here — hdr-resume-fix.service reactivates on its own, it greps
# monitors.conf for that exact token.
monitor=DP-1,3840x2160@160,0x0,1.666667,bitdepth,10
monitor=HDMI-A-1,preferred,auto,1.666667
# Change to 1 if on a 1x display (then change last "auto" to 1 in monitor=)
# Change to something like 1.75 for fractional scaling (can work well with 1.66667 monitor scaling)
# Note: You must relaunch Hyprland after changing any env like this (use Super+Esc, then Relaunch)
# env = GDK_SCALE,2

# Use single default monitor (see all monitors with: hyprctl monitors)
# Format: monitor = [port], resolution, position, scale
# monitor=,preferred,auto,auto

# Exmaple for fractional scaling that works well with GDK_SCALE,1.75
# monitor=,preferred,auto,1.666667

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60.00, auto, 2
# monitor = eDP-1, 2880x1920@120.00, auto, 2
workspace= name:1, monitor:DP-1
workspace= name:2, monitor:DP-1
workspace= name:3, monitor:DP-1
workspace= name:4, monitor:DP-1
workspace= name:5, monitor:HDMI-A-1
workspace= name:6, monitor:HDMI-A-1
exec-once = hyprctl dispatch workspace 1
